version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: evote_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: mydb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: evote_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: admin123
      DB_NAME_MAIN: mydb
      DB_NAME_IDENTITY: gg
      DB_PORT: 3306
      HMAC_SECRET_KEY: change-this-to-a-secure-random-key-in-production
      LANGUAGE: en
    stdin_open: true
    tty: true

volumes:
  mysql_data:
